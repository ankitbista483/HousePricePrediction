<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
</head>
<body>
    <h1>House Price Prediction</h1>
    <form action="/predict" method="POST">
        <label for="Area">Area:</label>
        <input type="text" id="Area" name="Area" required><br><br>

        <label for="Bedrooms">Bedrooms:</label>
        <input type="text" id="Bedrooms" name="Bedrooms" required><br><br>

        <label for="Bathrooms">Bathrooms:</label>
        <input type="text" id="Bathrooms" name="Bathrooms" required><br><br>


        <label for="Floors">Floors:</label>
        <input type="number" id="Floors" name="Floors" required><br><br>

        <label for="YearBuilt">Year Built:</label>
        <input type="number" id="YearBuilt" name="YearBuilt" required><br><br>

        <label for="Location">Location:</label>
        <input type="text" id="Location" name="Location" required><br><br>
    
        <label for="Condition">Condition:</label>
        <input type="text" id="Condition" name="Condition" required><br><br>

        <label for="Garage">Garage:</label>
        <input type="text" id="Garage" name="Garage" required><br><br>

        <label for="HouseAge">House Age:</label>
        <input type="number" id="HouseAge" name="HouseAge" required><br><br>


        

        <input type="submit" value="Predict">
    </form>

    {% if prediction %}
        <h2>Predicted Price: ${{ prediction }}</h2>
    {% endif %}
</body>
</html>
